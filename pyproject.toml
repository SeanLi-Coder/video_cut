[project]
name = "local-video-cutter"
version = "1.6.0"
description = "A one-click cross-platform local video cutter, frame extractor, rotator, and AI enhancer"
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
