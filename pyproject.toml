[project]
name = "local-video-cutter"
version = "1.10.3"
description = "A cross-platform video cutter, frame extractor, and rotator with Windows CUDA AI enhancement"
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
