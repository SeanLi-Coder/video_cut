[project]
name = "local-video-cutter"
version = "1.4.1"
description = "A one-click local video cutter, frame extractor, rotator, and AI enhancer for macOS"
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
